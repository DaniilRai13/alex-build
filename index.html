<html lang="cs">

    <!-- <title>, description a OG/Twitter řeší per-route komponenta Seo
         (vite-react-ssg <Head>), aby se neduplikovaly. -->

    <!-- Structured data: local business (JSON-LD). Per-page entities (services,
         projects) reference this @id so Google ties them to one organisation. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "@id": "https://kartstav.cz/#organization",
        "name": "KartStav Development s.r.o.",
        "alternateName": "KartStav",
        "identifier": "29883229",
        "url": "https://kartstav.cz",
        "logo": "https://kartstav.cz/favicon-512.png",
        "image": "https://kartstav.cz/og-image.jpg",
        "priceRange": "$$",
        "telephone": "+420774896027",
        "email": "info@kartstav.cz",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Čenětická 2413/1a, Chodov",
          "postalCode": "149 00",
          "addressLocality": "Praha",
          "addressCountry": "CZ"
        },
        "areaServed": "Praha",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday"
            ],
            "opens": "09:00",
            "closes": "18:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
